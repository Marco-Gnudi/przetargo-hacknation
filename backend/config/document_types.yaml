# Document types for Odwołania2JSON.
# Add a type by appending one entry. Do not change Python to register it.
# Each keyword pattern is a regex (case-insensitive). A type's score is the sum
# of weights of patterns that match at least once. The winner must reach
# `threshold` and lead the next type by at least `margin`. Otherwise the
# document is unclassified and the pipeline writes {}.
threshold: 7
margin: 1

document_types:
  - id: odwolanie
    output_filename: odwolanie.json
    keywords:
      # Whole line, including "O D W O Ł A N I E". Not enough on its own:
      # the KPA textbook uses that heading and must stay below threshold.
      - pattern: '^\s*o\s*d\s*w\s*o\s*[łl]\s*a\s*n\s*i\s*e\s*[:.]?\s*$'
        weight: 4
      # Line label "Odwołujący:", not "odwołującej się" from the KPA textbook.
      - pattern: '^\s*odwo[łl]uj[aą]cy\b'
        weight: 3
      - pattern: 'prezes\w*\s+krajowej\s+izby\s+odwo[łl]awczej'
        weight: 3
    fields:
      - OdwolanieKIO.data
      - OdwolanieKIO.czynnosc_dzien
      - OdwolanieKIO.czynnosc_powod_id
      - OdwolanieKIO.czynnosc_opis
      - OdwolanieKIO.miejscowosc
      - Odwolujacy[].krs
      - Odwolujacy[].nazwa
      - Odwolujacy[].nip
      - Odwolujacy[].regon
      - Odwolujacy[].przez-pelnomocnika
      - Odwolujacy[].pelnomocnik.imie_nazwisko
      - Odwolujacy[].pelnomocnik.nazwa
      - Odwolujacy[].pelnomocnik.mail
      - Zamawiajacy[].krs
      - Zamawiajacy[].nazwa
      - Zamawiajacy[].nip
      - Zamawiajacy[].regon
      - Zamawiajacy[].prowadzacy_postepowanie
      - ZamowieniePubliczne.numer_bzp
      - ZamowieniePubliczne.numer_postepowania
      - ZamowieniePubliczne.numer_ted
      - ZamowieniePubliczne.tytul

  - id: pelnomocnictwo
    output_filename: pelnomocnictwo.json
    keywords:
      - pattern: '^\s*p\s*e\s*[łl]\s*n\s*o\s*m\s*o\s*c\s*n\s*i\s*c\s*t\s*w\s*o(?:\s+procesowe)?\s*[:.]?\s*$'
        weight: 7
    fields:
      - mocodawca[].data.imie_nazwisko
      - mocodawca[].data.krs
      - mocodawca[].data.nazwa
      - mocodawca[].data.nip
      - mocodawca[].data.typ
      - mocodawca[].podpisujacy[].imie_nazwisko
      - pelnomocnicy[].imie_nazwisko
      - pelnomocnicy[].pesel

  - id: przelew
    output_filename: przelew.json
    keywords:
      - pattern: 'potwierdzenie\s+(?:realizacji\s+)?(?:polecenia\s+)?przelewu|potwierdzenie\s+przelewu(?:\s+krajowego)?|potwierdzenie\s+wykonania\s+przelewu|potwierdzenie\s+transakcji|potwierdzenie\s+operacji\s+bankowej|dow[oó]d\s+wykonania\s+przelewu|poleceni[ae]\s+przelewu'
        weight: 7
    fields:
      - przelew_bankowy.data_operacji
      - przelew_bankowy.kwota
      - przelew_bankowy.na_rachunek
      - przelew_bankowy.numer_transakcji
      - przelew_bankowy.tytul
      - przelew_bankowy.z_rachunku
